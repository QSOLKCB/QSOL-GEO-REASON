[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-geo-reason"
version = "0.3.0.dev0"
description = "Deterministic geometry instrumentation and canonical local-model capture for geometric-reasoning research."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
capture = [
    "torch>=2.2.2,<2.3",
    "transformers>=4.40.2,<4.41",
    "huggingface-hub>=0.23,<0.24",
    "tokenizers>=0.19.1,<0.20",
    "safetensors>=0.4.3,<0.5",
]

[project.scripts]
qsol-geo-sim = "qsol_geo_reason.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
# POSIX resolves the extensionless privileged-Bash wrapper; Windows command
# lookup resolves qsol-geo-capture.cmd.  The Windows .py file is an internal
# isolated/no-site stage-0 used only by that .cmd wrapper.
script-files = [
    "scripts/qsol-geo-capture",
    "scripts/qsol-geo-capture.cmd",
    "scripts/qsol-geo-capture-windows.py",
]

[tool.setuptools.packages.find]
where = ["src"]
