[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-geo-reason"
version = "0.1.0"
description = "Deterministic reference instrumentation for geometric-reasoning research."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
qsol-geo-sim = "qsol_geo_reason.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
