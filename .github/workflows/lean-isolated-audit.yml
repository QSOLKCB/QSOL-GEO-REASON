name: lean-isolated-audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LEAN_VERSION: "4.33.1"
  LEAN_LINUX_SHA256: "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235"
  MATHLIB_COMMIT: "0df444a360eaa60ab8c11dca51a86af692955474"
  EXPECTED_LAKE_MANIFEST_SHA256: "646d5b171d7b7200f4f85d887ff655c45ee7796019ada4aab7e4ca759f41602b"
  EXPECTED_LEAN_TOOLCHAIN_SHA256: "3aac669c7a910ec2389f4e4f921b605adf6ebf2d1e0c9b9cd0be4d33f3f5db71"
  EXPECTED_BUILD_CANONICAL_SHA256: "91f7181f1657481a8a00a3f4fe67b8d5663951838b5a0a76ef2adbd8b54e66d3"
  EXPECTED_BUILD_XOR_SHA256: "5140247acee0acb36de98fa8192602e09815d27207c38d62a83b818861a0a5a3"
  EXPECTED_BUILD_ARTIFACT_COUNT: "37312"
  SOURCE_CACHE_SCHEMA: "geo-lean-source-v3"
  BUILD_CACHE_SCHEMA: "geo-lean-deps-v1"
  PROTECTED_AUDIT_MARKER: "QSOL_PROTECTED_AUDIT_COMPLETE targets=12 theorem_kinds=verified axiom_allowlist=verified project_initializers=not_executed"

jobs:
  isolated-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          runtime_decl_sha="$(printf 'leanprover/lean4:v%s\n' "$LEAN_VERSION" | sha256sum | awk '{print $1}')"
          test "$runtime_decl_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          echo "${EXPECTED_LEAN_TOOLCHAIN_SHA256}  lean-toolchain" | sha256sum --check --strict

      - name: Install and freeze pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

          staging="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          sudo install -d -o root -g root -m 0755 /opt/qsol-lean
          lean_home="/opt/qsol-lean/${LEAN_VERSION}"
          sudo rm -rf "$lean_home"
          sudo mv "$staging" "$lean_home"
          sudo chown -R root:root "$lean_home"
          sudo chmod -R a-w "$lean_home"
          sudo chmod 0755 /opt/qsol-lean "$lean_home"

          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          lean_sha="$(sha256sum "$lean_home/bin/lean" | awk '{print $1}')"
          lake_sha="$(sha256sum "$lean_home/bin/lake" | awk '{print $1}')"
          echo "LEAN_HOME=$lean_home" >> "$GITHUB_ENV"
          echo "PINNED_LEAN_BIN_SHA256=$lean_sha" >> "$GITHUB_ENV"
          echo "PINNED_LAKE_BIN_SHA256=$lake_sha" >> "$GITHUB_ENV"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          "$lean_home/bin/lean" --version
          "$lean_home/bin/lake" --version

      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 2 ]; then
            echo "Multicore formal build requires at least 2 runner CPUs; observed ${cpus}" >&2
            exit 1
          fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "LEAN_WORKERS=${workers}" >> "$GITHUB_ENV"

      - name: Derive declaration-bound source cache identity
        id: source-key
        shell: bash
        run: |
          set -euo pipefail
          declaration_sha="$(sha256sum lakefile.lean | awk '{print $1}')"
          toolchain_sha="$(sha256sum lean-toolchain | awk '{print $1}')"
          test "$toolchain_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          key="${SOURCE_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${toolchain_sha}-${declaration_sha}-${EXPECTED_LAKE_MANIFEST_SHA256}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned dependency source state
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
            .lean-cache/source-receipt.json
          key: ${{ steps.source-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Purge generated package Lake state
        shell: bash
        run: |
          set -euo pipefail
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake"
          done

      - name: Verify restored dependency source state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean \
            --receipt .lean-cache/source-receipt.json

      - name: Derive audited build cache identity
        id: build-key
        shell: bash
        run: |
          set -euo pipefail
          actual_manifest_sha="$(sha256sum lake-manifest.json | awk '{print $1}')"
          test "$actual_manifest_sha" = "$EXPECTED_LAKE_MANIFEST_SHA256"
          key="${BUILD_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${actual_manifest_sha}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Restore externally anchored dependency artifacts
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages/*/.lake/build
            .lean-cache/dependency-receipt.json
          key: ${{ steps.build-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Verify external dependency artifact anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_dependency_receipt.py verify \
            --root .lake/packages \
            --receipt .lean-cache/dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"

      - name: Freeze reviewed inputs and prepare isolated identities
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolbuild 2>/dev/null || true
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolaudit 2>/dev/null || true

          sudo install -d -o root -g root -m 0555 /opt/qsol-lean-audit
          audit_sha="$(sha256sum Lean/GeoReason/Audit.lean | awk '{print $1}')"
          receipt_sha="$(sha256sum .lean-cache/dependency-receipt.json | awk '{print $1}')"
          sudo install -o root -g root -m 0444 Lean/GeoReason/Audit.lean /opt/qsol-lean-audit/Audit.lean
          sudo install -o root -g root -m 0444 .lean-cache/dependency-receipt.json /opt/qsol-lean-audit/dependency-receipt.json
          echo "PINNED_AUDIT_SHA256=$audit_sha" >> "$GITHUB_ENV"
          echo "PINNED_DEPENDENCY_RECEIPT_SHA256=$receipt_sha" >> "$GITHUB_ENV"

          # Allow isolated identities to traverse into the checkout only.
          sudo chmod o+x /home/runner /home/runner/work "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

          # Freeze every reviewed theorem/config/dependency input and the
          # protected recompilation helper before any project Lake
          # configuration is elaborated.
          sudo chown -R root:root Lean scripts .lake/packages lakefile.lean lean-toolchain lake-manifest.json
          sudo chmod -R a-w Lean scripts .lake/packages lakefile.lean lean-toolchain lake-manifest.json
          sudo chown root:root .lake
          sudo chmod 0755 .lake

          sudo install -d -o qsolbuild -g qsolbuild -m 0700 /tmp/qsolbuild-home
          sudo install -d -o qsolaudit -g qsolaudit -m 0700 /tmp/qsolaudit-home

          # Lake stores compiled package configurations in workspace .lake/config.
          # Only the non-sudo build identity may populate that generated area.
          sudo rm -rf .lake/config .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 .lake/config

          # Pre-create the one deterministic ProofWidgets marker that must live
          # beside tracked source. qsolbuild can write this file only, not its
          # root-owned parent directory or any tracked dependency input.
          lock_file="$GITHUB_WORKSPACE/.lake/packages/proofwidgets/widget/package-lock.json"
          hash_file="${lock_file}.hash"
          test -f "$lock_file"
          test ! -L "$lock_file"
          sudo install -o qsolbuild -g qsolbuild -m 0600 /dev/null "$hash_file"

          marker_script="/opt/qsol-lean-audit/cache-proofwidgets-lock.lean"
          cat <<EOF | sudo tee "$marker_script" >/dev/null
          import Lake
          open Lake
          def main : IO Unit :=
            cacheFileHash "$lock_file" (text := true)
          EOF
          sudo chown root:root "$marker_script"
          sudo chmod 0444 "$marker_script"

          # Lake must be able to inspect authenticated remote.origin.url after
          # the privilege drop, while neither isolated identity may change it.
          config_count=0
          while IFS= read -r -d '' config; do
            config_count="$((config_count + 1))"
            test "$(stat -c '%a' "$config")" = "444"
            sudo -u qsolbuild test -r "$config"
            sudo -u qsolaudit test -r "$config"
            if sudo -u qsolbuild test -w "$config"; then
              echo "Build identity can write verified Git config: $config" >&2
              exit 1
            fi
            if sudo -u qsolaudit test -w "$config"; then
              echo "Audit identity can write verified Git config: $config" >&2
              exit 1
            fi
          done < <(find .lake/packages -type f -path '*/.git/config' -print0)
          test "$config_count" -gt 0

      - name: Materialize ProofWidgets marker after input freeze
        shell: bash
        run: |
          set -euo pipefail
          marker_script="/opt/qsol-lean-audit/cache-proofwidgets-lock.lean"
          hash_file="$GITHUB_WORKSPACE/.lake/packages/proofwidgets/widget/package-lock.json.hash"
          (
            cd /opt/qsol-lean-audit
            sudo -u qsolbuild env -i \
              HOME=/tmp/qsolbuild-home \
              PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
              "$LEAN_HOME/bin/lean" --run "$marker_script"
          )
          test -f "$hash_file"
          test ! -L "$hash_file"
          sudo chown root:root "$hash_file"
          sudo chmod 0444 "$hash_file"
          echo "Materialized ProofWidgets Lake hash without evaluating project lakefile.lean."

      - name: Prime Lake configuration under build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            MATHLIB_NO_CACHE_ON_UPDATE=1 \
            "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --version

      - name: Freeze generated Lake configuration and open build output
        shell: bash
        run: |
          set -euo pipefail
          test -d .lake/config
          sudo chown -R root:root .lake/config
          sudo find .lake/config -type d -exec chmod 0555 {} +
          sudo find .lake/config -type f -exec chmod 0444 {} +

          # Any compile-time side effects from configuration elaboration are
          # discarded from the project output surface before the real build.
          sudo rm -rf .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0755 .lake/build

          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"
          if sudo -u qsolbuild test -w Lean/GeoReason/Audit.lean; then
            echo "Build identity can write reviewed audit source" >&2
            exit 1
          fi
          if sudo -u qsolbuild test -w lakefile.lean; then
            echo "Build identity can write reviewed Lake declaration" >&2
            exit 1
          fi

      - name: Rebuild GeoReason with build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          timing_file="/tmp/qsolbuild-home/lean-isolated-project-build.time"
          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            MATHLIB_NO_CACHE_ON_UPDATE=1 \
            /usr/bin/time -f 'isolated-project-build wall=%e user=%U sys=%S maxrss_kb=%M' -o "$timing_file" \
            "$LEAN_HOME/bin/lake" build --wfail
          sudo cat "$timing_file"

      - name: Terminate build descendants, freeze outputs, and verify protected inputs
        shell: bash
        run: |
          set -euo pipefail
          terminate_qsolbuild() {
            sudo pkill -TERM -u qsolbuild 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              if ! sudo pgrep -u qsolbuild >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            sudo pkill -KILL -u qsolbuild 2>/dev/null || true
            sleep 1
            if sudo pgrep -u qsolbuild >/dev/null 2>&1; then
              echo "qsolbuild descendant survived termination boundary" >&2
              exit 1
            fi
          }
          terminate_qsolbuild

          # Killing the identity closes every writable descriptor before mode
          # changes freeze the project object graph.
          sudo chown -R root:root .lake/build
          sudo chmod -R a-w .lake/build
          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum /opt/qsol-lean-audit/dependency-receipt.json | awk '{print $1}')" = "$PINNED_DEPENDENCY_RECEIPT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"

      - name: Recompile reviewed GeoReason modules inside protected audit boundary
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u qsolbuild test -w scripts/protected_lean_recompile.sh; then
            echo "qsolbuild can write protected recompilation helper" >&2
            exit 1
          fi
          bash scripts/protected_lean_recompile.sh

      - name: Reverify frozen dependency closure after protected compilation
        shell: bash
        run: |
          set -euo pipefail
          if sudo pgrep -u qsolbuild >/dev/null 2>&1; then
            echo "qsolbuild process exists after protected recompilation" >&2
            exit 1
          fi
          test "$(sha256sum /opt/qsol-lean-audit/dependency-receipt.json | awk '{print $1}')" = "$PINNED_DEPENDENCY_RECEIPT_SHA256"
          python3 scripts/lean_dependency_receipt.py verify \
            --root .lake/packages \
            --receipt /opt/qsol-lean-audit/dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"

      - name: Reject project proof placeholders and explicit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean --exclude='Audit.lean'; then
            echo "Lean proof placeholder or explicit axiom declaration found" >&2
            exit 1
          fi

      - name: Run non-initializing protected theorem audit as read-only identity
        shell: bash
        run: |
          set -euo pipefail
          audit_lean_path="$(cat /opt/qsol-lean-audit/lean-path)"
          test -n "$audit_lean_path"
          sudo -u qsolaudit env -i \
            HOME=/tmp/qsolaudit-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_PATH="$audit_lean_path" \
            LEAN_NUM_THREADS=1 \
            "$LEAN_HOME/bin/lean" --run /opt/qsol-lean-audit/Audit.lean \
            2>&1 | tee /tmp/lean-isolated-audit.log
          if ! grep -Fxq "$PROTECTED_AUDIT_MARKER" /tmp/lean-isolated-audit.log; then
            echo "Non-initializing protected audit completion marker missing" >&2
            exit 1
          fi
          echo "Protected audit imported GeoReason with loadExts=false; project initializers were not executed." >> "$GITHUB_STEP_SUMMARY"
          echo "qsolbuild descendants were terminated before object freeze and the dependency closure was reverified afterward." >> "$GITHUB_STEP_SUMMARY"

  isolated-cold-trust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          runtime_decl_sha="$(printf 'leanprover/lean4:v%s\n' "$LEAN_VERSION" | sha256sum | awk '{print $1}')"
          test "$runtime_decl_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          echo "${EXPECTED_LEAN_TOOLCHAIN_SHA256}  lean-toolchain" | sha256sum --check --strict

      - name: Install and freeze pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

          staging="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          sudo install -d -o root -g root -m 0755 /opt/qsol-lean
          lean_home="/opt/qsol-lean/${LEAN_VERSION}"
          sudo rm -rf "$lean_home"
          sudo mv "$staging" "$lean_home"
          sudo chown -R root:root "$lean_home"
          sudo chmod -R a-w "$lean_home"
          sudo chmod 0755 /opt/qsol-lean "$lean_home"

          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          echo "LEAN_HOME=$lean_home" >> "$GITHUB_ENV"
          echo "PINNED_LEAN_BIN_SHA256=$(sha256sum "$lean_home/bin/lean" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "PINNED_LAKE_BIN_SHA256=$(sha256sum "$lean_home/bin/lake" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "$lean_home/bin" >> "$GITHUB_PATH"

      - name: Freeze cold reviewed inputs before dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolbuild 2>/dev/null || true
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolaudit 2>/dev/null || true

          sudo install -d -o root -g root -m 0555 /opt/qsol-lean-audit
          audit_sha="$(sha256sum Lean/GeoReason/Audit.lean | awk '{print $1}')"
          sudo install -o root -g root -m 0444 Lean/GeoReason/Audit.lean /opt/qsol-lean-audit/Audit.lean
          echo "PINNED_AUDIT_SHA256=$audit_sha" >> "$GITHUB_ENV"

          # Allow isolated identities to traverse into the checkout, but make
          # the checkout root itself non-writable before any project Lake code
          # is evaluated.
          sudo chmod o+x /home/runner /home/runner/work "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
          sudo chown -R root:root Lean scripts lakefile.lean lean-toolchain
          sudo chmod -R a-w Lean scripts lakefile.lean lean-toolchain

          sudo rm -rf .lake lake-manifest.json
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 .lake
          sudo install -o qsolbuild -g qsolbuild -m 0600 /dev/null lake-manifest.json
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 /tmp/qsolbuild-home
          sudo install -d -o qsolaudit -g qsolaudit -m 0700 /tmp/qsolaudit-home

          sudo chown root:root "$GITHUB_WORKSPACE"
          sudo chmod 0555 "$GITHUB_WORKSPACE"

          for input in \
            Lean/GeoReason/Audit.lean \
            lakefile.lean \
            lean-toolchain \
            scripts/verify_lean_source_state.py \
            scripts/lean_dependency_receipt.py \
            scripts/protected_lean_recompile.sh; do
            if sudo -u qsolbuild test -w "$input"; then
              echo "Cold resolver can write reviewed input before lake update: $input" >&2
              exit 1
            fi
          done
          sudo -u qsolbuild test -w .lake
          sudo -u qsolbuild test -w lake-manifest.json

      - name: Resolve and verify pinned dependency sources under isolated identity
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            MATHLIB_NO_CACHE_ON_UPDATE=1 \
            "$LEAN_HOME/bin/lake" update

          test -d .lake
          test ! -L .lake
          test -d .lake/packages
          test ! -L .lake/packages
          test "$(realpath .lake/packages)" = "$GITHUB_WORKSPACE/.lake/packages"
          test -f lake-manifest.json
          test ! -L lake-manifest.json
          actual_manifest_sha="$(sha256sum lake-manifest.json | awk '{print $1}')"
          test "$actual_manifest_sha" = "$EXPECTED_LAKE_MANIFEST_SHA256"

          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            test ! -L "$pkg"
            sudo rm -rf "$pkg/.lake"
          done

          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH=/usr/bin:/bin \
            /usr/bin/python3 scripts/verify_lean_source_state.py \
              --root .lake/packages \
              --lake-manifest lake-manifest.json \
              --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
              --dependency-declaration lakefile.lean

          sudo chown -R root:root .lake/packages lake-manifest.json
          sudo chmod -R a-w .lake/packages lake-manifest.json
          sudo chown root:root .lake
          sudo chmod 0755 .lake

      - name: Prepare cold-build and audit privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"

          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            sudo mkdir -p "$pkg/.lake"
            sudo chown -R qsolbuild:qsolbuild "$pkg/.lake"
          done
          sudo rm -rf .lake/config .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 .lake/config
          sudo install -d -o qsolbuild -g qsolbuild -m 0755 .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 /tmp/qsolbuild-home
          sudo install -d -o qsolaudit -g qsolaudit -m 0700 /tmp/qsolaudit-home

          lock_file="$GITHUB_WORKSPACE/.lake/packages/proofwidgets/widget/package-lock.json"
          hash_file="${lock_file}.hash"
          test -f "$lock_file"
          test ! -L "$lock_file"
          sudo install -o qsolbuild -g qsolbuild -m 0600 /dev/null "$hash_file"

          marker_script="/opt/qsol-lean-audit/cache-proofwidgets-lock.lean"
          cat <<EOF | sudo tee "$marker_script" >/dev/null
          import Lake
          open Lake
          def main : IO Unit :=
            cacheFileHash "$lock_file" (text := true)
          EOF
          sudo chown root:root "$marker_script"
          sudo chmod 0444 "$marker_script"

          config_count=0
          while IFS= read -r -d '' config; do
            config_count="$((config_count + 1))"
            test "$(stat -c '%a' "$config")" = "444"
            sudo -u qsolbuild test -r "$config"
            sudo -u qsolaudit test -r "$config"
            if sudo -u qsolbuild test -w "$config"; then
              echo "Build identity can write verified Git config: $config" >&2
              exit 1
            fi
            if sudo -u qsolaudit test -w "$config"; then
              echo "Audit identity can write verified Git config: $config" >&2
              exit 1
            fi
          done < <(find .lake/packages -type f -path '*/.git/config' -print0)
          test "$config_count" -gt 0

          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 2 ]; then
            echo "Cold formal build requires at least 2 runner CPUs; observed ${cpus}" >&2
            exit 1
          fi
          echo "LEAN_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Materialize cold ProofWidgets marker after input freeze
        shell: bash
        run: |
          set -euo pipefail
          marker_script="/opt/qsol-lean-audit/cache-proofwidgets-lock.lean"
          hash_file="$GITHUB_WORKSPACE/.lake/packages/proofwidgets/widget/package-lock.json.hash"
          (
            cd /opt/qsol-lean-audit
            sudo -u qsolbuild env -i \
              HOME=/tmp/qsolbuild-home \
              PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
              "$LEAN_HOME/bin/lean" --run "$marker_script"
          )
          test -f "$hash_file"
          test ! -L "$hash_file"
          sudo chown root:root "$hash_file"
          sudo chmod 0444 "$hash_file"

      - name: Prime cold Lake configuration under build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            MATHLIB_NO_CACHE_ON_UPDATE=1 \
            "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --version
          sudo chown -R root:root .lake/config
          sudo find .lake/config -type d -exec chmod 0555 {} +
          sudo find .lake/config -type f -exec chmod 0444 {} +

      - name: Reconstruct formalization with build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolbuild env -i \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            MATHLIB_NO_CACHE_ON_UPDATE=1 \
            "$LEAN_HOME/bin/lake" build --wfail

      - name: Terminate build descendants, freeze cold outputs, and authenticate dependency closure
        shell: bash
        run: |
          set -euo pipefail
          terminate_qsolbuild() {
            sudo pkill -TERM -u qsolbuild 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              if ! sudo pgrep -u qsolbuild >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            sudo pkill -KILL -u qsolbuild 2>/dev/null || true
            sleep 1
            if sudo pgrep -u qsolbuild >/dev/null 2>&1; then
              echo "qsolbuild descendant survived cold freeze boundary" >&2
              exit 1
            fi
          }
          terminate_qsolbuild

          # Mode changes are applied only after every qsolbuild process has
          # exited, so no writable descriptor can survive the freeze.
          sudo chown -R root:root .lake/build .lake/packages
          sudo chmod -R a-w .lake/build .lake/packages

          receipt_tmp="$RUNNER_TEMP/dependency-receipt.json"
          python3 scripts/lean_dependency_receipt.py create \
            --root .lake/packages \
            --receipt "$receipt_tmp" \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"
          receipt_sha="$(sha256sum "$receipt_tmp" | awk '{print $1}')"
          sudo install -o root -g root -m 0444 "$receipt_tmp" /opt/qsol-lean-audit/cold-dependency-receipt.json
          echo "PINNED_COLD_DEPENDENCY_RECEIPT_SHA256=$receipt_sha" >> "$GITHUB_ENV"

          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"

      - name: Recompile reviewed GeoReason modules inside protected cold audit boundary
        shell: bash
        run: |
          set -euo pipefail
          if sudo -u qsolbuild test -w scripts/protected_lean_recompile.sh; then
            echo "qsolbuild can write protected recompilation helper" >&2
            exit 1
          fi
          bash scripts/protected_lean_recompile.sh

      - name: Reverify frozen cold dependency closure after protected compilation
        shell: bash
        run: |
          set -euo pipefail
          if sudo pgrep -u qsolbuild >/dev/null 2>&1; then
            echo "qsolbuild process exists after protected cold recompilation" >&2
            exit 1
          fi
          test "$(sha256sum /opt/qsol-lean-audit/cold-dependency-receipt.json | awk '{print $1}')" = "$PINNED_COLD_DEPENDENCY_RECEIPT_SHA256"
          python3 scripts/lean_dependency_receipt.py verify \
            --root .lake/packages \
            --receipt /opt/qsol-lean-audit/cold-dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"

      - name: Reject cold project proof placeholders and explicit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean --exclude='Audit.lean'; then
            echo "Lean proof placeholder or explicit axiom declaration found" >&2
            exit 1
          fi

      - name: Run non-initializing protected cold theorem audit
        shell: bash
        run: |
          set -euo pipefail
          audit_lean_path="$(cat /opt/qsol-lean-audit/lean-path)"
          test -n "$audit_lean_path"
          sudo -u qsolaudit env -i \
            HOME=/tmp/qsolaudit-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_PATH="$audit_lean_path" \
            LEAN_NUM_THREADS=1 \
            "$LEAN_HOME/bin/lean" --run /opt/qsol-lean-audit/Audit.lean \
            2>&1 | tee /tmp/lean-isolated-cold-audit.log
          if ! grep -Fxq "$PROTECTED_AUDIT_MARKER" /tmp/lean-isolated-cold-audit.log; then
            echo "Non-initializing protected cold audit completion marker missing" >&2
            exit 1
          fi
          echo "Release-grade cold authority completed with no project initializer execution and a post-freeze dependency revalidation." >> "$GITHUB_STEP_SUMMARY"
