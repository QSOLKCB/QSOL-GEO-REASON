name: lean-isolated-audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LEAN_VERSION: "4.33.1"
  LEAN_LINUX_SHA256: "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235"
  MATHLIB_COMMIT: "0df444a360eaa60ab8c11dca51a86af692955474"
  EXPECTED_LAKE_MANIFEST_SHA256: "646d5b171d7b7200f4f85d887ff655c45ee7796019ada4aab7e4ca759f41602b"
  EXPECTED_LEAN_TOOLCHAIN_SHA256: "3aac669c7a910ec2389f4e4f921b605adf6ebf2d1e0c9b9cd0be4d33f3f5db71"
  EXPECTED_BUILD_CANONICAL_SHA256: "91f7181f1657481a8a00a3f4fe67b8d5663951838b5a0a76ef2adbd8b54e66d3"
  EXPECTED_BUILD_XOR_SHA256: "5140247acee0acb36de98fa8192602e09815d27207c38d62a83b818861a0a5a3"
  EXPECTED_BUILD_ARTIFACT_COUNT: "37312"
  SOURCE_CACHE_SCHEMA: "geo-lean-source-v3"
  BUILD_CACHE_SCHEMA: "geo-lean-deps-v1"

jobs:
  isolated-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          runtime_decl_sha="$(printf 'leanprover/lean4:v%s\n' "$LEAN_VERSION" | sha256sum | awk '{print $1}')"
          test "$runtime_decl_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          echo "${EXPECTED_LEAN_TOOLCHAIN_SHA256}  lean-toolchain" | sha256sum --check --strict

      - name: Install and freeze pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

          staging="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          sudo install -d -o root -g root -m 0755 /opt/qsol-lean
          lean_home="/opt/qsol-lean/${LEAN_VERSION}"
          sudo rm -rf "$lean_home"
          sudo mv "$staging" "$lean_home"
          sudo chown -R root:root "$lean_home"
          sudo chmod -R a-w "$lean_home"
          sudo chmod 0755 /opt/qsol-lean "$lean_home"

          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          lean_sha="$(sha256sum "$lean_home/bin/lean" | awk '{print $1}')"
          lake_sha="$(sha256sum "$lean_home/bin/lake" | awk '{print $1}')"
          echo "LEAN_HOME=$lean_home" >> "$GITHUB_ENV"
          echo "PINNED_LEAN_BIN_SHA256=$lean_sha" >> "$GITHUB_ENV"
          echo "PINNED_LAKE_BIN_SHA256=$lake_sha" >> "$GITHUB_ENV"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          "$lean_home/bin/lean" --version
          "$lean_home/bin/lake" --version

      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 2 ]; then
            echo "Multicore formal build requires at least 2 runner CPUs; observed ${cpus}" >&2
            exit 1
          fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "LEAN_WORKERS=${workers}" >> "$GITHUB_ENV"

      - name: Derive declaration-bound source cache identity
        id: source-key
        shell: bash
        run: |
          set -euo pipefail
          declaration_sha="$(sha256sum lakefile.lean | awk '{print $1}')"
          toolchain_sha="$(sha256sum lean-toolchain | awk '{print $1}')"
          test "$toolchain_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          key="${SOURCE_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${toolchain_sha}-${declaration_sha}-${EXPECTED_LAKE_MANIFEST_SHA256}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned dependency source state
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
            .lean-cache/source-receipt.json
          key: ${{ steps.source-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Purge generated package Lake state
        shell: bash
        run: |
          set -euo pipefail
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake"
          done

      - name: Verify restored dependency source state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean \
            --receipt .lean-cache/source-receipt.json

      - name: Derive audited build cache identity
        id: build-key
        shell: bash
        run: |
          set -euo pipefail
          actual_manifest_sha="$(sha256sum lake-manifest.json | awk '{print $1}')"
          test "$actual_manifest_sha" = "$EXPECTED_LAKE_MANIFEST_SHA256"
          key="${BUILD_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${actual_manifest_sha}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Restore externally anchored dependency artifacts
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages/*/.lake/build
            .lean-cache/dependency-receipt.json
          key: ${{ steps.build-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Verify external dependency artifact anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_dependency_receipt.py verify \
            --root .lake/packages \
            --receipt .lean-cache/dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"

      - name: Materialize deterministic ProofWidgets Lake hash marker
        shell: bash
        run: |
          set -euo pipefail
          lock_file=".lake/packages/proofwidgets/widget/package-lock.json"
          hash_file="${lock_file}.hash"
          test -f "$lock_file"
          test ! -L "$lock_file"
          marker_script="$RUNNER_TEMP/cache-proofwidgets-lock.lean"
          cat > "$marker_script" <<'EOF'
          import Lake
          open Lake
          def main : IO Unit :=
            cacheFileHash ".lake/packages/proofwidgets/widget/package-lock.json" (text := true)
          EOF
          "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --run "$marker_script"
          test -f "$hash_file"
          test ! -L "$hash_file"
          chmod 0444 "$hash_file"
          echo "Materialized deterministic Lake hash marker for verified ProofWidgets package-lock.json."

      - name: Prime Lake configuration before privilege drop
        shell: bash
        run: |
          set -euo pipefail
          "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --version

      - name: Freeze audit inputs and prepare unprivileged identities
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolbuild 2>/dev/null || true
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolaudit 2>/dev/null || true
          sudo install -d -o root -g root -m 0555 /opt/qsol-lean-audit
          audit_sha="$(sha256sum Lean/GeoReason/Audit.lean | awk '{print $1}')"
          sudo install -o root -g root -m 0444 Lean/GeoReason/Audit.lean /opt/qsol-lean-audit/Audit.lean
          echo "PINNED_AUDIT_SHA256=$audit_sha" >> "$GITHUB_ENV"

          # Allow the isolated identities to traverse into the checkout only.
          # This grants no read/write capability beyond existing directory modes.
          sudo chmod o+x /home/runner /home/runner/work "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

          sudo chown -R root:root Lean .lake/packages lakefile.lean lean-toolchain lake-manifest.json
          sudo chmod -R a-w Lean .lake/packages lakefile.lean lean-toolchain lake-manifest.json

          sudo mkdir -p .lake/build
          sudo chown -R qsolbuild:qsolbuild .lake/build
          sudo chmod 0755 .lake
          sudo chmod 0755 .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 /tmp/qsolbuild-home
          sudo install -d -o qsolaudit -g qsolaudit -m 0700 /tmp/qsolaudit-home

          # Lake needs to inspect authenticated remote.origin.url after the
          # privilege drop. The verifier publishes those configs as 0444:
          # readable by build/audit identities, immutable to both.
          config_count=0
          while IFS= read -r -d '' config; do
            config_count="$((config_count + 1))"
            test "$(stat -c '%a' "$config")" = "444"
            sudo -u qsolbuild test -r "$config"
            sudo -u qsolaudit test -r "$config"
            if sudo -u qsolbuild test -w "$config"; then
              echo "Build identity can write verified Git config: $config" >&2
              exit 1
            fi
            if sudo -u qsolaudit test -w "$config"; then
              echo "Audit identity can write verified Git config: $config" >&2
              exit 1
            fi
          done < <(find .lake/packages -type f -path '*/.git/config' -print0)
          test "$config_count" -gt 0

      - name: Rebuild GeoReason with build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          timing_file="/tmp/qsolbuild-home/lean-isolated-project-build.time"
          sudo -u qsolbuild env \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            /usr/bin/time -f 'isolated-project-build wall=%e user=%U sys=%S maxrss_kb=%M' -o "$timing_file" \
            "$LEAN_HOME/bin/lake" build --wfail
          sudo cat "$timing_file"

      - name: Freeze outputs and verify protected audit/toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R root:root .lake/build
          sudo chmod -R a-w .lake/build
          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"

      - name: Reject project proof placeholders and explicit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean --exclude='Audit.lean'; then
            echo "Lean proof placeholder or explicit axiom declaration found" >&2
            exit 1
          fi

      - name: Run protected compiled-theorem audit as read-only identity
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolaudit env \
            HOME=/tmp/qsolaudit-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS=1 \
            "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" /opt/qsol-lean-audit/Audit.lean \
            2>&1 | tee /tmp/lean-isolated-audit.log
          if ! grep -q 'Declarations are sorry-free!' /tmp/lean-isolated-audit.log; then
            echo "Protected compiled theorem graph did not report sorry-free" >&2
            exit 1
          fi
          if grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/lean-isolated-audit.log; then
            echo "Known disallowed compiled proof dependency found" >&2
            exit 1
          fi
          echo "Protected audit/toolchain remained outside the build identity's writable surface." >> "$GITHUB_STEP_SUMMARY"

  isolated-cold-trust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          runtime_decl_sha="$(printf 'leanprover/lean4:v%s\n' "$LEAN_VERSION" | sha256sum | awk '{print $1}')"
          test "$runtime_decl_sha" = "$EXPECTED_LEAN_TOOLCHAIN_SHA256"
          echo "${EXPECTED_LEAN_TOOLCHAIN_SHA256}  lean-toolchain" | sha256sum --check --strict

      - name: Install and freeze pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

          staging="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          sudo install -d -o root -g root -m 0755 /opt/qsol-lean
          lean_home="/opt/qsol-lean/${LEAN_VERSION}"
          sudo rm -rf "$lean_home"
          sudo mv "$staging" "$lean_home"
          sudo chown -R root:root "$lean_home"
          sudo chmod -R a-w "$lean_home"
          sudo chmod 0755 /opt/qsol-lean "$lean_home"

          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          echo "LEAN_HOME=$lean_home" >> "$GITHUB_ENV"
          echo "PINNED_LEAN_BIN_SHA256=$(sha256sum "$lean_home/bin/lean" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "PINNED_LAKE_BIN_SHA256=$(sha256sum "$lean_home/bin/lake" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "$lean_home/bin" >> "$GITHUB_PATH"

      - name: Resolve and verify pinned dependency sources
        shell: bash
        run: |
          set -euo pipefail
          lake update
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake"
          done
          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean
          "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --version

      - name: Materialize deterministic ProofWidgets Lake hash marker
        shell: bash
        run: |
          set -euo pipefail
          lock_file=".lake/packages/proofwidgets/widget/package-lock.json"
          hash_file="${lock_file}.hash"
          test -f "$lock_file"
          test ! -L "$lock_file"
          marker_script="$RUNNER_TEMP/cache-proofwidgets-lock.lean"
          cat > "$marker_script" <<'EOF'
          import Lake
          open Lake
          def main : IO Unit :=
            cacheFileHash ".lake/packages/proofwidgets/widget/package-lock.json" (text := true)
          EOF
          "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" --run "$marker_script"
          test -f "$hash_file"
          test ! -L "$hash_file"
          chmod 0444 "$hash_file"

      - name: Prepare cold-build and audit privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolbuild 2>/dev/null || true
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qsolaudit 2>/dev/null || true
          sudo install -d -o root -g root -m 0555 /opt/qsol-lean-audit
          audit_sha="$(sha256sum Lean/GeoReason/Audit.lean | awk '{print $1}')"
          sudo install -o root -g root -m 0444 Lean/GeoReason/Audit.lean /opt/qsol-lean-audit/Audit.lean
          echo "PINNED_AUDIT_SHA256=$audit_sha" >> "$GITHUB_ENV"

          # Same traversal-only grant as the verified-cache isolated audit.
          sudo chmod o+x /home/runner /home/runner/work "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

          sudo chown -R root:root Lean lakefile.lean lean-toolchain lake-manifest.json .lake/packages
          sudo chmod -R a-w Lean lakefile.lean lean-toolchain lake-manifest.json .lake/packages
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            sudo mkdir -p "$pkg/.lake"
            sudo chown -R qsolbuild:qsolbuild "$pkg/.lake"
          done
          sudo mkdir -p .lake/build
          sudo chown -R qsolbuild:qsolbuild .lake/build
          sudo install -d -o qsolbuild -g qsolbuild -m 0700 /tmp/qsolbuild-home
          sudo install -d -o qsolaudit -g qsolaudit -m 0700 /tmp/qsolaudit-home

          config_count=0
          while IFS= read -r -d '' config; do
            config_count="$((config_count + 1))"
            test "$(stat -c '%a' "$config")" = "444"
            sudo -u qsolbuild test -r "$config"
            sudo -u qsolaudit test -r "$config"
            if sudo -u qsolbuild test -w "$config"; then
              echo "Build identity can write verified Git config: $config" >&2
              exit 1
            fi
            if sudo -u qsolaudit test -w "$config"; then
              echo "Audit identity can write verified Git config: $config" >&2
              exit 1
            fi
          done < <(find .lake/packages -type f -path '*/.git/config' -print0)
          test "$config_count" -gt 0

          cpus="$(nproc)"; workers="$cpus"; if [ "$workers" -gt 4 ]; then workers=4; fi
          echo "LEAN_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Reconstruct formalization with build-only privileges
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolbuild env \
            HOME=/tmp/qsolbuild-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS="$LEAN_WORKERS" \
            "$LEAN_HOME/bin/lake" build --wfail

      - name: Freeze cold outputs and authenticate dependency closure
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R root:root .lake/build .lake/packages
          sudo chmod -R a-w .lake/build .lake/packages
          python3 scripts/lean_dependency_receipt.py create \
            --root .lake/packages \
            --receipt "$RUNNER_TEMP/dependency-receipt.json" \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --expected-canonical-sha256 "$EXPECTED_BUILD_CANONICAL_SHA256" \
            --expected-xor-fold-sha256 "$EXPECTED_BUILD_XOR_SHA256" \
            --expected-artifact-count "$EXPECTED_BUILD_ARTIFACT_COUNT"
          test "$(sha256sum /opt/qsol-lean-audit/Audit.lean | awk '{print $1}')" = "$PINNED_AUDIT_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lean" | awk '{print $1}')" = "$PINNED_LEAN_BIN_SHA256"
          test "$(sha256sum "$LEAN_HOME/bin/lake" | awk '{print $1}')" = "$PINNED_LAKE_BIN_SHA256"

      - name: Run protected cold compiled-theorem audit
        shell: bash
        run: |
          set -euo pipefail
          sudo -u qsolaudit env \
            HOME=/tmp/qsolaudit-home \
            PATH="$LEAN_HOME/bin:/usr/bin:/bin" \
            LEAN_NUM_THREADS=1 \
            "$LEAN_HOME/bin/lake" env "$LEAN_HOME/bin/lean" /opt/qsol-lean-audit/Audit.lean \
            2>&1 | tee /tmp/lean-isolated-cold-audit.log
          grep -q 'Declarations are sorry-free!' /tmp/lean-isolated-cold-audit.log
          if grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/lean-isolated-cold-audit.log; then exit 1; fi
