name: Codex round 47 fixture alignment

on:
  push:
    branches:
      - phase2a-canonical-hidden-state-capture

permissions:
  contents: write

concurrency:
  group: codex-round47-fixture-alignment
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2a-canonical-hidden-state-capture
          fetch-depth: 0

      - name: Align synthetic production fixtures
        run: python tools/codex_round47_fixture_patch.py

      - name: Run full Python regression matrix
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          python -m json.tool schemas/capture-run-manifest.schema.json >/dev/null

      - name: Commit tested fixture alignment and remove temporary machinery
        run: |
          rm .github/workflows/codex-round47-fixture-self-patch.yml
          rm tools/codex_round47_fixture_patch.py
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add tests/test_capture_codex_round5.py
          git add tests/test_capture_codex_round6.py
          git add .github/workflows/codex-round47-fixture-self-patch.yml
          git add tools/codex_round47_fixture_patch.py
          git commit -m "test: align production fixtures with provenance contract"
          git push origin HEAD:phase2a-canonical-hidden-state-capture
