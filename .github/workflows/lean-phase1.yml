name: lean-phase1

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Lean/**"
      - "lean-toolchain"
      - "lakefile.lean"
      - "LEAN-FORMALIZATION.md"
      - ".github/workflows/lean-phase1.yml"
  push:
    branches: ["lean-phase1-v0.1.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        run: |
          lake update
          lake exe cache get

      - name: Build formalization with warnings fatal
        run: lake build --wfail

      - name: Reject proof placeholders and local axioms
        shell: bash
        run: |
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean; then
            echo "Lean proof placeholder or local axiom found" >&2
            exit 1
          fi
