name: lean-phase1

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Lean/**"
      - "scripts/lean_dependency_receipt.py"
      - "scripts/verify_lean_source_state.py"
      - "lean-toolchain"
      - "lakefile.lean"
      - "LEAN-FORMALIZATION.md"
      - "LEAN-CACHE-POLICY.md"
      - ".github/workflows/lean-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

# The pinned mathlib post-update hook otherwise downloads a public binary cache.
# Our PR lane restores only repository-produced audited build artifacts and the
# cold-trust lane deliberately reconstructs them, so that hook is pure overhead.
env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  EXPECTED_LAKE_MANIFEST_SHA256: "646d5b171d7b7200f4f85d887ff655c45ee7796019ada4aab7e4ca759f41602b"

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_VERSION: "4.33.1"
      LEAN_LINUX_SHA256: "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235"
      MATHLIB_COMMIT: "0df444a360eaa60ab8c11dca51a86af692955474"
      SOURCE_CACHE_SCHEMA: "geo-lean-source-v2"
      BUILD_CACHE_SCHEMA: "geo-lean-deps-v1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          lean_home="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          "$lean_home/bin/lean" --version
          "$lean_home/bin/lake" --version

      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then
            workers=4
          fi
          if [ "$workers" -lt 2 ]; then
            echo "Multicore formal build requires at least 2 runner CPUs; observed ${cpus}" >&2
            exit 1
          fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "LEAN_WORKERS=${workers}" >> "$GITHUB_ENV"
          echo "Formal build will use ${workers} Lean threads on ${cpus} runner CPUs"

      - name: Derive declaration-bound source cache identity
        id: source-key
        shell: bash
        run: |
          set -euo pipefail
          declaration_sha="$(sha256sum lakefile.lean | awk '{print $1}')"
          key="${SOURCE_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${declaration_sha}-${EXPECTED_LAKE_MANIFEST_SHA256}"
          echo "declaration_sha=${declaration_sha}" >> "$GITHUB_OUTPUT"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "Pinned source cache identity: ${key}"

      - name: Restore pinned dependency source state
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
            .lean-cache/source-receipt.json
          key: ${{ steps.source-key.outputs.key }}

      - name: Verify restored pinned dependency source state
        if: steps.source-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean \
            --receipt .lean-cache/source-receipt.json
          echo "Verified declaration-bound pinned dependency source cache hit."

      - name: Resolve pinned dependency sources on first source-cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          lake update

          # Source-cache seeds must contain source/config state, not proof
          # objects from dependency hooks or earlier local builds.
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake/build"
          done
          if find .lake/packages -type f \( -name '*.olean' -o -name '*.ilean' \) -path '*/.lake/build/*' -print -quit | grep -q .; then
            echo "Precompiled dependency proof artifact survived source reset" >&2
            exit 1
          fi

          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean \
            --receipt .lean-cache/source-receipt.json \
            --write-receipt
          elapsed="$(( $(date +%s) - started ))"
          echo "Pinned source resolution completed in ${elapsed}s"
          {
            echo "### Lean dependency source state"
            echo "- Source cache: \`miss\`"
            echo "- Action: resolved exact pinned git revisions"
            echo "- lakefile SHA-256: \`${{ steps.source-key.outputs.declaration_sha }}\`"
            echo "- tracked bytes/modes: \`verified against commit trees\`"
            echo "- mathlib public-cache post-update hook: \`disabled\`"
            echo "- elapsed: \`${elapsed}s\`"
            echo "- lake manifest SHA-256: \`${EXPECTED_LAKE_MANIFEST_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save verified pinned dependency source state
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
            .lean-cache/source-receipt.json
          key: ${{ steps.source-key.outputs.key }}

      - name: Derive audited build-artifact cache identity
        id: build-key
        shell: bash
        run: |
          set -euo pipefail
          actual_manifest_sha="$(sha256sum lake-manifest.json | awk '{print $1}')"
          test "$actual_manifest_sha" = "$EXPECTED_LAKE_MANIFEST_SHA256"
          key="${BUILD_CACHE_SCHEMA}-${RUNNER_OS}-x86_64-lean-${LEAN_VERSION}-${LEAN_LINUX_SHA256}-${actual_manifest_sha}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "Audited build cache identity: ${key}"

      - name: Restore cold-built dependency artifacts
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages/*/.lake/build
            .lean-cache/dependency-receipt.json
          key: ${{ steps.build-key.outputs.key }}

      - name: Verify canonical and XOR dependency receipts
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_dependency_receipt.py verify \
            --root .lake/packages \
            --receipt .lean-cache/dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT"
          echo "Verified dependency build cache hit; canonical SHA-256 is authoritative and XOR-fold is regression evidence only."

      - name: Cold fallback on first build-cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          timing_file="$RUNNER_TEMP/lean-cache-seed-build.time"
          /usr/bin/time \
            -f 'cache-seed-cold-build wall=%e user=%U sys=%S maxrss_kb=%M' \
            -o "$timing_file" \
            lake build --wfail
          timing="$(cat "$timing_file")"
          echo "$timing"
          {
            echo "### Lean verified-cache lane"
            echo "- Build cache: \`miss\`"
            echo "- Action: cold source reconstruction to seed verified build cache"
            echo "- Lean threads: \`${LEAN_WORKERS}\`"
            echo "- Timing: \`${timing}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast project rebuild from verified dependency state
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lake/build
          timing_file="$RUNNER_TEMP/lean-fast-project-build.time"
          /usr/bin/time \
            -f 'verified-cache-project-build wall=%e user=%U sys=%S maxrss_kb=%M' \
            -o "$timing_file" \
            lake build --wfail
          timing="$(cat "$timing_file")"
          echo "$timing"
          {
            echo "### Lean verified-cache lane"
            echo "- Source state: \`verified ${SOURCE_CACHE_SCHEMA}\`"
            echo "- Build cache: \`verified hit\`"
            echo "- Dependency source bytes/modes: \`commit-tree verified\`"
            echo "- Dependency state: canonical SHA-256 manifest verified"
            echo "- XOR-fold: regression receipt verified"
            echo "- GeoReason project build: rebuilt from current source"
            echo "- Lean threads: \`${LEAN_WORKERS}\`"
            echo "- Timing: \`${timing}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject source proof placeholders and explicit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean --exclude='Audit.lean'; then
            echo "Lean proof placeholder or explicit axiom declaration found" >&2
            exit 1
          fi

      - name: Audit compiled theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Lean/GeoReason/Audit.lean 2>&1 | tee /tmp/lean-axiom-audit.log
          if ! grep -q 'Declarations are sorry-free!' /tmp/lean-axiom-audit.log; then
            echo "Compiled theorem graph did not report sorry-free" >&2
            exit 1
          fi
          if grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/lean-axiom-audit.log; then
            echo "Known disallowed compiled proof dependency found" >&2
            exit 1
          fi

      - name: Create dependency receipt after cold build-cache seed
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_dependency_receipt.py create \
            --root .lake/packages \
            --receipt .lean-cache/dependency-receipt.json \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT"

      - name: Save audited cold-built dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages/*/.lake/build
            .lean-cache/dependency-receipt.json
          key: ${{ steps.build-key.outputs.key }}

  cold-trust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_VERSION: "4.33.1"
      LEAN_LINUX_SHA256: "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235"
      MATHLIB_COMMIT: "0df444a360eaa60ab8c11dca51a86af692955474"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          lean_home="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          "$lean_home/bin/lean" --version
          "$lean_home/bin/lake" --version

      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then
            workers=4
          fi
          if [ "$workers" -lt 2 ]; then
            echo "Multicore trust build requires at least 2 runner CPUs; observed ${cpus}" >&2
            exit 1
          fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "LEAN_WORKERS=${workers}" >> "$GITHUB_ENV"
          echo "Cold trust reconstruction will use ${workers} Lean threads on ${cpus} runner CPUs"

      - name: Resolve and verify pinned dependencies from source
        shell: bash
        run: |
          set -euo pipefail
          lake update
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake/build"
          done
          if find .lake/packages -type f \( -name '*.olean' -o -name '*.ilean' \) -path '*/.lake/build/*' -print -quit | grep -q .; then
            echo "Precompiled dependency proof artifact survived source reset" >&2
            exit 1
          fi
          python3 scripts/verify_lean_source_state.py \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean

      - name: Build formalization and pinned dependencies from source
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          timing_file="$RUNNER_TEMP/lean-cold-build.time"
          /usr/bin/time \
            -f 'cold-source-build wall=%e user=%U sys=%S maxrss_kb=%M' \
            -o "$timing_file" \
            lake build --wfail
          timing="$(cat "$timing_file")"
          dependency_oleans="$(find .lake/packages -type f -name '*.olean' -print | wc -l | tr -d ' ')"
          project_oleans="$(find .lake/build -type f -name '*.olean' -print | wc -l | tr -d ' ')"
          echo "$timing"
          echo "Cold source rebuild produced ${dependency_oleans} dependency OLean files and ${project_oleans} project OLean files with ${LEAN_WORKERS} Lean threads"
          {
            echo "### Lean cold-source trust build"
            echo "- Cache restore: \`disabled\`"
            echo "- mathlib public-cache post-update hook: \`disabled\`"
            echo "- source git revisions/bytes/modes: \`verified against frozen commit trees\`"
            echo "- Lean threads: \`${LEAN_WORKERS}\`"
            echo "- Dependency OLean files rebuilt: \`${dependency_oleans}\`"
            echo "- Project OLean files rebuilt: \`${project_oleans}\`"
            echo "- Timing: \`${timing}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject source proof placeholders and explicit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Lean --exclude='Audit.lean'; then
            echo "Lean proof placeholder or explicit axiom declaration found" >&2
            exit 1
          fi

      - name: Audit compiled theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Lean/GeoReason/Audit.lean 2>&1 | tee /tmp/lean-axiom-audit.log
          if ! grep -q 'Declarations are sorry-free!' /tmp/lean-axiom-audit.log; then
            echo "Compiled theorem graph did not report sorry-free" >&2
            exit 1
          fi
          if grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/lean-axiom-audit.log; then
            echo "Known disallowed compiled proof dependency found" >&2
            exit 1
          fi

      - name: Emit cold-build dependency receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_dependency_receipt.py create \
            --root .lake/packages \
            --receipt "$RUNNER_TEMP/dependency-receipt.json" \
            --lake-manifest lake-manifest.json \
            --lean-version "$LEAN_VERSION" \
            --lean-archive-sha256 "$LEAN_LINUX_SHA256" \
            --mathlib-commit "$MATHLIB_COMMIT"
          {
            echo "- Dependency receipt: canonical SHA-256 + non-authoritative XOR-fold emitted in log"
          } >> "$GITHUB_STEP_SUMMARY"
