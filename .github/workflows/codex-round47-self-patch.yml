name: Codex round 47 self patch

on:
  push:
    branches:
      - phase2a-canonical-hidden-state-capture

permissions:
  contents: write

concurrency:
  group: codex-round47-self-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2a-canonical-hidden-state-capture
          fetch-depth: 0

      - name: Apply guarded patch
        run: python tools/codex_round47_patch.py

      - name: Run targeted regression
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest jsonschema
          python -m pytest -q tests/test_capture_codex_round47.py
          python -m compileall -q src tests/test_capture_codex_round47.py

      - name: Commit source fix and remove temporary patch machinery
        run: |
          rm .github/workflows/codex-round47-self-patch.yml
          rm tools/codex_round47_patch.py
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/qsol_geo_reason/capture_backend_core.py
          git add src/qsol_geo_reason/capture_common.py
          git add src/qsol_geo_reason/capture_provenance.py
          git add schemas/capture-run-manifest.schema.json
          git add tests/test_capture_codex_round47.py
          git add .github/workflows/codex-round47-self-patch.yml
          git add tools/codex_round47_patch.py
          git commit -m "fix: bind production execution provenance"
          git push origin HEAD:phase2a-canonical-hidden-state-capture
