name: Codex round 49 guarded patch

on:
  push:
    branches:
      - phase2a-canonical-hidden-state-capture

permissions:
  contents: write

concurrency:
  group: codex-round49-self-patch
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2a-canonical-hidden-state-capture
          fetch-depth: 0

      - name: Apply guarded review fixes
        run: python tools/codex_round49_patch.py

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run focused round 49 regressions
        run: python -m unittest discover -s tests -p 'test_capture_codex_round49.py' -v

      - name: Run complete Python conformance suite
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          python -m json.tool schemas/capture-run-manifest.schema.json >/dev/null
          python -m json.tool schemas/capture-request.schema.json >/dev/null
          python -m json.tool schemas/captured-trajectory.schema.json >/dev/null

      - name: Commit tested changes and remove temporary machinery
        run: |
          rm .github/workflows/codex-round49-self-patch.yml
          rm tools/codex_round49_patch.py
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/qsol_geo_reason/capture_backend_production.py
          git add src/qsol_geo_reason/capture_execute.py
          git add src/qsol_geo_reason/capture_backend_core.py
          git add protocols/GEO-CAP-001.md
          git add tests/test_capture_codex_round49.py
          git add .github/workflows/codex-round49-self-patch.yml
          git add tools/codex_round49_patch.py
          git commit -m "fix: harden observation entry and context bounds"
          git push origin HEAD:phase2a-canonical-hidden-state-capture
