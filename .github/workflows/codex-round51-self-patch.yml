name: codex-round51-self-patch

on:
  push:
    branches: [phase2a-canonical-hidden-state-capture]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply Round 51 hardening
        run: python tools/codex_round51_patch.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Round 51 regressions
        run: python -m unittest discover -s tests -p 'test_capture_codex_round51.py' -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Frozen reference verification
        run: python tools/verify_reference.py
      - name: Commit validated patch
        run: |
          rm -f .github/workflows/codex-round51-self-patch.yml tools/codex_round51_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden interrupt ownership and mapped runtime receipts"
          git push origin HEAD:phase2a-canonical-hidden-state-capture
