name: round54-hardening-gate

on:
  push:
    branches: [phase2a-canonical-hidden-state-capture]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Apply guarded Round 54 patch
        run: python tools/apply_round54_fix.py
      - name: Focused Round 53-54 regressions
        run: python -m unittest discover -s tests -p 'test_capture_codex_round5*.py' -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Verify frozen reference
        run: python tools/verify_reference.py
      - name: Compile and diff hygiene
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Commit validated hardening
        run: |
          rm tools/apply_round54_fix.py .github/workflows/round54-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: retain restoration exclusion and timestamp-safe runtime stability'
          git push origin HEAD:phase2a-canonical-hidden-state-capture
