name: phase1-reference

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Standalone capture bootstrap
        shell: bash
        run: |
          set -euo pipefail
          installed="$(command -v qsol-geo-capture)"
          test "$(head -n 1 "$installed")" = '#!/bin/bash -p'
          grep -F 'exec "$qsol_python" -I -S -B - "$qsol_script" "$@"' "$installed"
          hook="$RUNNER_TEMP/qsol-standalone-site-hook"
          marker="$RUNNER_TEMP/qsol-standalone-sitecustomize-ran"
          mkdir -p "$hook"
          cat > "$hook/sitecustomize.py" <<'PY'
          import os
          from pathlib import Path
          marker = os.environ.get("QSOL_STANDALONE_SITE_MARKER")
          if marker:
              Path(marker).write_text("sitecustomize executed\n", encoding="utf-8")
          PY
          PYTHONPATH="$hook" QSOL_STANDALONE_SITE_MARKER="$marker" qsol-geo-capture --help >/dev/null
          test ! -e "$marker"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen reference fixture
        run: python tools/verify_reference.py
