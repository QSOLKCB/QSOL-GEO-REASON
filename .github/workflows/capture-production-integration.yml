name: capture-production-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-backend-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU PyTorch reference build
        run: >-
          python -m pip install
          -c constraints/capture-reference-py311.txt
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.2.2+cpu"
      - name: Install complete frozen capture reference environment
        run: >-
          python -m pip install
          -c constraints/capture-reference-py311.txt
          -e ".[capture]"
          "jsonschema==4.23.0"
      - name: Verify complete runtime lock
        run: python tools/verify_capture_reference_environment.py
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Real offline production capture and deterministic replay
        run: python tools/run_capture_production_integration.py
