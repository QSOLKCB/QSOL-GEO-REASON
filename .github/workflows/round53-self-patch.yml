name: round53-self-patch

on:
  push:
    branches: [phase2a-canonical-hidden-state-capture]
    paths:
      - tools/apply_round53.py
      - .github/workflows/round53-self-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2a-canonical-hidden-state-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply guarded Round 53 patch
        run: python tools/apply_round53.py
      - name: Install package
        run: python -m pip install -e .
      - name: Compile changed Python
        run: |
          python -m py_compile \
            src/qsol_geo_reason/capture_backend_isolated.py \
            src/qsol_geo_reason/capture_cuda_runtime.py \
            src/qsol_geo_reason/capture_cpu_runtime.py \
            src/qsol_geo_reason/capture_backend_round39.py \
            tests/test_capture_codex_round53.py
      - name: Focused regressions
        run: python -m unittest tests/test_capture_codex_round52.py tests/test_capture_codex_round53.py -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Verify frozen reference fixture
        run: python tools/verify_reference.py
      - name: Diff check
        run: git diff --check
      - name: Commit validated patch
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add \
            src/qsol_geo_reason/capture_backend_isolated.py \
            src/qsol_geo_reason/capture_cuda_runtime.py \
            src/qsol_geo_reason/capture_cpu_runtime.py \
            src/qsol_geo_reason/capture_backend_round39.py \
            tests/test_capture_codex_round53.py
          git rm tools/apply_round53.py .github/workflows/round53-self-patch.yml
          git commit -m "fix: bind runtime stability and startup cleanup"
          git push origin HEAD:phase2a-canonical-hidden-state-capture
